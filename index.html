<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VulaTrade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function () {
        var appRoutes = [
          '/dashboard',
          '/public-page',
          '/setup',
          '/location',
          '/products',
          '/customers',
          '/messages',
          '/bookings',
          '/sales',
          '/expenses',
          '/reviews',
          '/business-file',
          '/vuke',
          '/plans',
          '/settings'
        ];

        var shouldLoadChat = appRoutes.some(function (route) {
          return window.location.pathname === route || window.location.pathname.startsWith(route + '/');
        });

        if (!shouldLoadChat) {
          return;
        }

        var script = document.createElement('script');
        script.src = 'https://beta.leadconnectorhq.com/loader.js';
        script.setAttribute(
          'data-resources-url',
          'https://beta.leadconnectorhq.com/chat-widget/loader.js'
        );
        script.setAttribute('data-widget-id', '6a0c4b54a490b94b8e3b6539');
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
